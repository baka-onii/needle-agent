[project]
name = "relay"
version = "0.1.0"
description = "Relay: specialised lightweight local harness — reasoning LLM plus tool-calling action models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Katorin", email = "anmolpoonam41@gmail.com" }]
keywords = ["agent", "tool-calling", "llm", "langgraph", "relay", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph>=1.2,<1.3",
    "pydantic>=2.13,<3",
    "cactus-needle>=2.0,<3",
    # Timezone database for stdlib zoneinfo on platforms without system tzdata
    # (Windows). Data only; get_time still uses datetime + zoneinfo.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]
browser = ["playwright>=1.50,<2"]

[project.scripts]
relay = "relay.cli:main"

[project.urls]
Homepage = "https://github.com/baka-onii/relay"
Repository = "https://github.com/baka-onii/relay"
Issues = "https://github.com/baka-onii/relay/issues"
Specification = "https://github.com/baka-onii/relay/blob/main/docs/spec-v0.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel.force-include]
"config/defaults.toml" = "relay/defaults/defaults.toml"
"config/prompts/reasoning.md" = "relay/defaults/prompts/reasoning.md"
"config/prompts/translator.md" = "relay/defaults/prompts/translator.md"
"config/prompts/confirmation.md" = "relay/defaults/prompts/confirmation.md"
